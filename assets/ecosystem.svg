<svg viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project ecosystem map">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    /* Estado base = estado final. As animacoes entram com fill-mode backwards,
       entao se nada animar (renderizador estatico, motion reduzido) o conteudo
       aparece inteiro em vez de sumir. */
    .draw { stroke: #C0C0C0; stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 0; animation: d 1.4s cubic-bezier(.6,0,.2,1) .2s backwards; }
    @keyframes d { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    .wire { stroke: #C0C0C0; stroke-width: 1; stroke-dasharray: 340; stroke-dashoffset: 0; animation: w 1.2s ease .3s backwards; }
    @keyframes w { from { stroke-dashoffset: 340; } to { stroke-dashoffset: 0; } }
    .f { animation: f .8s ease .1s backwards; }
    @keyframes f { from { opacity: 0; } to { opacity: 1; } }
    .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .a1{animation-delay:.10s} .a2{animation-delay:.20s} .a3{animation-delay:.32s} .a4{animation-delay:.44s}
    .a5{animation-delay:.56s} .a6{animation-delay:.68s} .a7{animation-delay:.80s} .a8{animation-delay:.92s}
    .dot { animation: p 2.4s ease-in-out infinite; }
    @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .ring { opacity: 0; animation: r 2.4s ease-out infinite; }
    @keyframes r { 0% { transform: scale(.4); opacity: .8 } 80%,100% { transform: scale(2.6); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .draw,.wire,.f,.rise,.dot,.ring { animation: none; }
    }
  </style>
  <g>
    <path class="wire" d="M430 133 L326 62"/>
    <path class="wire" d="M430 147 L326 212"/>
    <path class="wire" d="M570 133 L674 62"/>
    <path class="wire" d="M570 147 L674 212"/>
    <path class="wire" d="M500 165 L500 246"/>
  </g>
  <g class="f a1">
    <rect x="430" y="115" width="140" height="50" fill="none" stroke="#555555" stroke-width="1"/>
    <text class="mono" x="500" y="138" font-size="11" letter-spacing="3" fill="#000000" text-anchor="middle">PAULOGAAB21</text>
    <text class="mono" x="500" y="154" font-size="10" fill="#888888" text-anchor="middle">5 repositories</text>
  </g>
  <g class="f a3">
    <rect x="96" y="40" width="230" height="44" fill="none" stroke="#C0C0C0"/>
    <text class="mono" x="110" y="60" font-size="12" fill="#444444">IACoreX</text>
    <text class="mono" x="110" y="75" font-size="10" fill="#888888">Rails &#183; Vue &#183; Sidekiq &#183; live</text>
  </g>
  <g class="f a4">
    <rect x="96" y="190" width="230" height="44" fill="none" stroke="#C0C0C0"/>
    <text class="mono" x="110" y="210" font-size="12" fill="#444444">MiPaciente</text>
    <text class="mono" x="110" y="225" font-size="10" fill="#888888">Rails &#183; Vue &#183; PostgreSQL</text>
  </g>
  <g class="f a5">
    <rect x="674" y="40" width="230" height="44" fill="none" stroke="#C0C0C0"/>
    <text class="mono" x="688" y="60" font-size="12" fill="#444444">ufc3recomp</text>
    <text class="mono" x="688" y="75" font-size="10" fill="#888888">C++ &#183; PowerPC &#8594; x86-64</text>
  </g>
  <g class="f a6">
    <rect x="674" y="190" width="230" height="44" fill="none" stroke="#C0C0C0"/>
    <text class="mono" x="688" y="210" font-size="12" fill="#444444">NotiGO</text>
    <text class="mono" x="688" y="225" font-size="10" fill="#888888">Go &#183; HTTP/JSON API</text>
  </g>
  <g class="f a7">
    <rect x="385" y="246" width="230" height="44" fill="none" stroke="#C0C0C0"/>
    <text class="mono" x="399" y="266" font-size="12" fill="#444444">reblue-ptbr-fix</text>
    <text class="mono" x="399" y="281" font-size="10" fill="#888888">C++ &#183; 360 texture formats</text>
  </g>
</svg>
