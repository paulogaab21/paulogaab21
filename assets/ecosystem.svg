<svg viewBox="0 0 1000 340" width="1000" height="340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project ecosystem map">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke: #C0C0C0; stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: d 1.4s cubic-bezier(.6,0,.2,1) .2s forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .f { opacity: 0; animation: f .8s ease .1s forwards; }
    @keyframes f { to { opacity: 1; } }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .a1{animation-delay:.10s} .a2{animation-delay:.20s} .a3{animation-delay:.32s} .a4{animation-delay:.44s}
    .a5{animation-delay:.56s} .a6{animation-delay:.68s} .a7{animation-delay:.80s} .a8{animation-delay:.92s}
    .dot { animation: p 2.4s ease-in-out infinite; }
    @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .ring { animation: r 2.4s ease-out infinite; }
    @keyframes r { 0% { transform: scale(.4); opacity: .8 } 80%,100% { transform: scale(2.6); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .draw,.f,.rise,.dot,.ring { animation: none; }
      .draw { stroke-dashoffset: 0; } .f,.rise { opacity: 1; } .ring { opacity: 0; }
    }
  </style>
  <g>
    <path class="draw" d="M500 170 L211 82" stroke-dasharray="340" stroke-dashoffset="340"/>
    <path class="draw" d="M500 170 L211 262" stroke-dasharray="340" stroke-dashoffset="340"/>
    <path class="draw" d="M500 170 L789 82" stroke-dasharray="340" stroke-dashoffset="340"/>
    <path class="draw" d="M500 170 L789 262" stroke-dasharray="340" stroke-dashoffset="340"/>
    <path class="draw" d="M500 170 L500 36" stroke-dasharray="340" stroke-dashoffset="340"/>
    <path class="draw" d="M500 170 L500 308" stroke-dasharray="340" stroke-dashoffset="340"/>
  </g>
  <g class="f a1">
    <rect x="430" y="145" width="140" height="50" fill="none" stroke="#555555" stroke-width="1"/>
    <text class="mono" x="500" y="168" font-size="11" letter-spacing="3" fill="#000000" text-anchor="middle">PAULOGAAB21</text>
    <text class="mono" x="500" y="184" font-size="10" fill="#888888" text-anchor="middle">6 repositories</text>
  </g>
  <g class="f a3">
    <rect x="96" y="60" width="230" height="44" fill="none" stroke="#C0C0C0"/>
    <text class="mono" x="110" y="80" font-size="12" fill="#444444">IACoreX</text>
    <text class="mono" x="110" y="95" font-size="10" fill="#888888">Rails &#183; Vue &#183; Sidekiq &#183; live</text>
  </g>
  <g class="f a4">
    <rect x="96" y="240" width="230" height="44" fill="none" stroke="#C0C0C0"/>
    <text class="mono" x="110" y="260" font-size="12" fill="#444444">MiPaciente</text>
    <text class="mono" x="110" y="275" font-size="10" fill="#888888">Rails &#183; Vue &#183; PostgreSQL</text>
  </g>
  <g class="f a5">
    <rect x="674" y="60" width="230" height="44" fill="none" stroke="#C0C0C0"/>
    <text class="mono" x="688" y="80" font-size="12" fill="#444444">ufc3recomp</text>
    <text class="mono" x="688" y="95" font-size="10" fill="#888888">C++ &#183; PowerPC &#8594; x86-64</text>
  </g>
  <g class="f a6">
    <rect x="674" y="240" width="230" height="44" fill="none" stroke="#C0C0C0"/>
    <text class="mono" x="688" y="260" font-size="12" fill="#444444">NotiGO</text>
    <text class="mono" x="688" y="275" font-size="10" fill="#888888">Go &#183; HTTP/JSON API</text>
  </g>
  <g class="f a6">
    <rect x="385" y="14" width="230" height="44" fill="none" stroke="#C0C0C0"/>
    <text class="mono" x="399" y="34" font-size="12" fill="#444444">Fable2Recomp</text>
    <text class="mono" x="399" y="49" font-size="10" fill="#888888">C++ &#183; contributor</text>
  </g>
  <g class="f a7">
    <rect x="385" y="286" width="230" height="44" fill="none" stroke="#C0C0C0"/>
    <text class="mono" x="399" y="306" font-size="12" fill="#444444">reblue-ptbr-fix</text>
