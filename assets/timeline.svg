<svg viewBox="0 0 1000 278" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline and experience">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    /* Estado base = estado final. As animacoes entram com fill-mode backwards,
       entao se nada animar (renderizador estatico, motion reduzido) o conteudo
       aparece inteiro em vez de sumir. Uma curva so em tudo e escalonamento
       curto: a secao inteira entra como uma onda, sem atraso no primeiro
       quadro. */
    .draw { stroke: #C0C0C0; stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 0; animation: d 1.5s cubic-bezier(.16,.84,.44,1) backwards; }
    @keyframes d { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    .wire { stroke: #C0C0C0; stroke-width: 1; stroke-dasharray: 340; stroke-dashoffset: 0; animation: w 1.1s cubic-bezier(.16,.84,.44,1) .18s backwards; }
    @keyframes w { from { stroke-dashoffset: 340; } to { stroke-dashoffset: 0; } }
    .f { animation: f .9s cubic-bezier(.16,.84,.44,1) backwards; }
    @keyframes f { from { opacity: 0; } to { opacity: 1; } }
    .rise { animation: rise .85s cubic-bezier(.16,.84,.44,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .a1{animation-delay:.06s} .a2{animation-delay:.12s} .a3{animation-delay:.18s} .a4{animation-delay:.24s}
    .a5{animation-delay:.30s} .a6{animation-delay:.36s} .a7{animation-delay:.42s} .a8{animation-delay:.48s}
    .dot { animation: p 2.6s ease-in-out infinite; }
    @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .ring { opacity: 0; animation: r 2.6s cubic-bezier(.16,.84,.44,1) infinite; }
    @keyframes r { 0% { transform: scale(.4); opacity: .8 } 80%,100% { transform: scale(2.6); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .draw,.wire,.f,.rise,.dot,.ring { animation: none; }
    }
  </style>
  <text class="mono rise a1" x="48" y="26" font-size="12" letter-spacing="2" fill="#888888">UNTIL MAR 2025</text>
  <text class="mono rise a1" x="210" y="26" font-size="14" fill="#000000">Store supervisor &#8212; Drogasil</text>
  <text class="mono rise a1" x="210" y="46" font-size="13" fill="#888888">Daily operations, team, priorities and customer service at a hard pace.</text>
  <line x1="48" y1="64" x2="952" y2="64" stroke="#E5E5E5" stroke-width="1"/>
  <text class="mono rise a2" x="48" y="88" font-size="12" letter-spacing="2" fill="#888888">2024 &#8594;</text>
  <text class="mono rise a2" x="210" y="88" font-size="14" fill="#000000">Software Engineering &#8212; Grupo Anchieta</text>
  <text class="mono rise a2" x="210" y="108" font-size="13" fill="#888888">Fourth semester, expected to graduate in September 2027.</text>
  <line x1="48" y1="126" x2="952" y2="126" stroke="#E5E5E5" stroke-width="1"/>
  <text class="mono rise a3" x="48" y="150" font-size="12" letter-spacing="2" fill="#888888">2025 &#8594;</text>
  <text class="mono rise a3" x="210" y="150" font-size="14" fill="#000000">My own projects shipped</text>
  <text class="mono rise a3" x="210" y="170" font-size="13" fill="#888888">IACoreX and MiPaciente deployed with Docker Compose, Nginx and PgBouncer.</text>
  <line x1="48" y1="188" x2="952" y2="188" stroke="#E5E5E5" stroke-width="1"/>
  <text class="mono rise a4" x="48" y="212" font-size="12" letter-spacing="2" fill="#888888">NOW</text>
  <text class="mono rise a4" x="210" y="212" font-size="14" fill="#000000">First job as a developer</text>
  <text class="mono rise a4" x="210" y="232" font-size="13" fill="#888888">Backend or full stack, junior. Jundia&#237; area &#8212; on-site, hybrid or remote.</text>
  <line x1="48" y1="250" x2="952" y2="250" stroke="#E5E5E5" stroke-width="1"/>
</svg>
