<svg viewBox="0 0 1000 244" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paulo Gabriel da Silva - backend and full stack developer">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    /* Estado base = estado final. As animacoes entram com fill-mode backwards,
       entao se nada animar (renderizador estatico, motion reduzido) o conteudo
       aparece inteiro em vez de sumir. Uma curva so em tudo e escalonamento
       curto: a secao inteira entra como uma onda, sem atraso no primeiro
       quadro. */
    .draw { stroke: #444444; stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 0; animation: d 1.5s cubic-bezier(.16,.84,.44,1) backwards; }
    @keyframes d { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    .wire { stroke: #444444; stroke-width: 1; stroke-dasharray: 340; stroke-dashoffset: 0; animation: w 1.1s cubic-bezier(.16,.84,.44,1) .18s backwards; }
    @keyframes w { from { stroke-dashoffset: 340; } to { stroke-dashoffset: 0; } }
    .f { animation: f .9s cubic-bezier(.16,.84,.44,1) backwards; }
    @keyframes f { from { opacity: 0; } to { opacity: 1; } }
    .rise { animation: rise .85s cubic-bezier(.16,.84,.44,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .a1{animation-delay:.06s} .a2{animation-delay:.12s} .a3{animation-delay:.18s} .a4{animation-delay:.24s}
    .a5{animation-delay:.30s} .a6{animation-delay:.36s} .a7{animation-delay:.42s} .a8{animation-delay:.48s}
    .dot { animation: p 2.6s ease-in-out infinite; }
    @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .ring { opacity: 0; animation: r 2.6s cubic-bezier(.16,.84,.44,1) infinite; }
    @keyframes r { 0% { transform: scale(.4); opacity: .8 } 80%,100% { transform: scale(2.6); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .draw,.wire,.f,.rise,.dot,.ring { animation: none; }
    }
  </style>
  <text class="mono rise a1" x="500" y="40" font-size="11" letter-spacing="6" fill="#777777" text-anchor="middle">PAULOGAAB21</text>
  <text class="mono rise a2" x="500" y="112" font-size="46" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">PAULO GABRIEL</text>
  <text class="mono rise a3" x="500" y="164" font-size="46" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">DA SILVA</text>
  <line class="draw" x1="340" y1="192" x2="660" y2="192"/>
  <text class="mono rise a5" x="500" y="224" font-size="13" letter-spacing="3" fill="#777777" text-anchor="middle">BACKEND / FULL STACK DEVELOPER · JUNDIA&#205;, BRAZIL</text>
</svg>
