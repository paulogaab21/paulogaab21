<svg viewBox="0 0 1000 278" width="1000" height="278" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline and experience">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke: #444444; stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: d 1.4s cubic-bezier(.6,0,.2,1) .2s forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .f { opacity: 0; animation: f .8s ease .1s forwards; }
    @keyframes f { to { opacity: 1; } }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .a1{animation-delay:.10s} .a2{animation-delay:.20s} .a3{animation-delay:.32s} .a4{animation-delay:.44s}
    .a5{animation-delay:.56s} .a6{animation-delay:.68s} .a7{animation-delay:.80s} .a8{animation-delay:.92s}
    .dot { animation: p 2.4s ease-in-out infinite; }
    @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .ring { animation: r 2.4s ease-out infinite; }
    @keyframes r { 0% { transform: scale(.4); opacity: .8 } 80%,100% { transform: scale(2.6); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .draw,.f,.rise,.dot,.ring { animation: none; }
      .draw { stroke-dashoffset: 0; } .f,.rise { opacity: 1; } .ring { opacity: 0; }
    }
  </style>
  <text class="mono rise a1" x="48" y="26" font-size="12" letter-spacing="2" fill="#777777">UNTIL MAR 2025</text>
  <text class="mono rise a1" x="210" y="26" font-size="14" fill="#FFFFFF">Store supervisor &#8212; Drogasil</text>
  <text class="mono rise a1" x="210" y="46" font-size="13" fill="#777777">Daily operations, team, priorities and customer service at a hard pace.</text>
  <line x1="48" y1="64" x2="952" y2="64" stroke="#1C1C1C" stroke-width="1"/>
  <text class="mono rise a2" x="48" y="88" font-size="12" letter-spacing="2" fill="#777777">2024 &#8594;</text>
  <text class="mono rise a2" x="210" y="88" font-size="14" fill="#FFFFFF">Software Engineering &#8212; Grupo Anchieta</text>
  <text class="mono rise a2" x="210" y="108" font-size="13" fill="#777777">Fourth semester, expected to graduate in September 2027.</text>
  <line x1="48" y1="126" x2="952" y2="126" stroke="#1C1C1C" stroke-width="1"/>
  <text class="mono rise a3" x="48" y="150" font-size="12" letter-spacing="2" fill="#777777">2025 &#8594;</text>
  <text class="mono rise a3" x="210" y="150" font-size="14" fill="#FFFFFF">My own projects shipped</text>
  <text class="mono rise a3" x="210" y="170" font-size="13" fill="#777777">IACoreX and MiPaciente deployed with Docker Compose, Nginx and PgBouncer.</text>
  <line x1="48" y1="188" x2="952" y2="188" stroke="#1C1C1C" stroke-width="1"/>
  <text class="mono rise a4" x="48" y="212" font-size="12" letter-spacing="2" fill="#777777">NOW</text>
  <text class="mono rise a4" x="210" y="212" font-size="14" fill="#FFFFFF">First job as a developer</text>
  <text class="mono rise a4" x="210" y="232" font-size="13" fill="#777777">Backend or full stack, junior. Jundia&#237; area &#8212; on-site, hybrid or remote.</text>
  <line x1="48" y1="250" x2="952" y2="250" stroke="#1C1C1C" stroke-width="1"/>
</svg>
