<svg viewBox="0 0 1000 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Featured projects">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    /* Estado base = estado final. As animacoes entram com fill-mode backwards,
       entao se nada animar (renderizador estatico, motion reduzido) o conteudo
       aparece inteiro em vez de sumir. Uma curva so em tudo e escalonamento
       curto: a secao inteira entra como uma onda, sem atraso no primeiro
       quadro. */
    .draw { stroke: #C0C0C0; stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 0; animation: d 1.5s cubic-bezier(.16,.84,.44,1) backwards; }
    @keyframes d { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    .wire { stroke: #C0C0C0; stroke-width: 1; stroke-dasharray: 340; stroke-dashoffset: 0; animation: w 1.1s cubic-bezier(.16,.84,.44,1) .18s backwards; }
    @keyframes w { from { stroke-dashoffset: 340; } to { stroke-dashoffset: 0; } }
    .f { animation: f .9s cubic-bezier(.16,.84,.44,1) backwards; }
    @keyframes f { from { opacity: 0; } to { opacity: 1; } }
    .rise { animation: rise .85s cubic-bezier(.16,.84,.44,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .a1{animation-delay:.06s} .a2{animation-delay:.12s} .a3{animation-delay:.18s} .a4{animation-delay:.24s}
    .a5{animation-delay:.30s} .a6{animation-delay:.36s} .a7{animation-delay:.42s} .a8{animation-delay:.48s}
    .dot { animation: p 2.6s ease-in-out infinite; }
    @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .ring { opacity: 0; animation: r 2.6s cubic-bezier(.16,.84,.44,1) infinite; }
    @keyframes r { 0% { transform: scale(.4); opacity: .8 } 80%,100% { transform: scale(2.6); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .draw,.wire,.f,.rise,.dot,.ring { animation: none; }
    }
  </style>
  <text class="mono rise a1" x="48" y="26" font-size="14" fill="#000000">IACoreX</text>
  <text class="mono rise a1" x="220" y="26" font-size="14" fill="#444444">Live AI-assisted customer support app &#8212; automated replies, scheduling,</text>
  <text class="mono rise a1" x="952" y="26" font-size="11" letter-spacing="2" fill="#888888" text-anchor="end">iacorex.com</text>
  <text class="mono rise a1" x="220" y="46" font-size="14" fill="#444444">unified inbox and an analytics panel.</text>
  <text class="mono rise a1" x="220" y="68" font-size="11" letter-spacing="1" fill="#999999">RAILS &#183; PUMA &#183; SIDEKIQ &#183; POSTGRESQL &#183; VUE &#183; VITE &#183; TS</text>
  <line x1="48" y1="84" x2="952" y2="84" stroke="#E5E5E5" stroke-width="1"/>
  <text class="mono rise a2" x="48" y="106" font-size="14" fill="#000000">MiPaciente</text>
  <text class="mono rise a2" x="220" y="106" font-size="14" fill="#444444">Clinical paperwork by link: intake forms, consent terms, contracts and</text>
  <text class="mono rise a2" x="952" y="106" font-size="11" letter-spacing="2" fill="#888888" text-anchor="end">mipaciente.com.br</text>
  <text class="mono rise a2" x="220" y="126" font-size="14" fill="#444444">progress notes.</text>
  <text class="mono rise a2" x="220" y="148" font-size="11" letter-spacing="1" fill="#999999">RAILS &#183; POSTGRESQL &#183; SIDEKIQ &#183; VUE &#183; VITE &#183; TS</text>
  <line x1="48" y1="164" x2="952" y2="164" stroke="#E5E5E5" stroke-width="1"/>
  <text class="mono rise a3" x="48" y="186" font-size="14" fill="#000000">NotiGO</text>
  <text class="mono rise a3" x="220" y="186" font-size="14" fill="#444444">HTTP/JSON API in Go that ingests events from seven services into one</text>
  <text class="mono rise a3" x="952" y="186" font-size="11" letter-spacing="2" fill="#888888" text-anchor="end">academic</text>
  <text class="mono rise a3" x="220" y="206" font-size="14" fill="#444444">notification hub. Per-source idempotency, filtering, pagination, append-only.</text>
  <text class="mono rise a3" x="220" y="228" font-size="11" letter-spacing="1" fill="#999999">GO &#183; REST &#183; SOA &#183; JSONL</text>
  <line x1="48" y1="244" x2="952" y2="244" stroke="#E5E5E5" stroke-width="1"/>
</svg>
