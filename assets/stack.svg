<svg viewBox="0 0 1000 256" width="1000" height="256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technical stack">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke: #C0C0C0; stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: d 1.4s cubic-bezier(.6,0,.2,1) .2s forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .f { opacity: 0; animation: f .8s ease .1s forwards; }
    @keyframes f { to { opacity: 1; } }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .a1{animation-delay:.10s} .a2{animation-delay:.20s} .a3{animation-delay:.32s} .a4{animation-delay:.44s}
    .a5{animation-delay:.56s} .a6{animation-delay:.68s} .a7{animation-delay:.80s} .a8{animation-delay:.92s}
    .dot { animation: p 2.4s ease-in-out infinite; }
    @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .ring { animation: r 2.4s ease-out infinite; }
    @keyframes r { 0% { transform: scale(.4); opacity: .8 } 80%,100% { transform: scale(2.6); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .draw,.f,.rise,.dot,.ring { animation: none; }
      .draw { stroke-dashoffset: 0; } .f,.rise { opacity: 1; } .ring { opacity: 0; }
    }
  </style>
  <line x1="178" y1="8" x2="178" y2="248" stroke="#C0C0C0" stroke-width="1" opacity=".4"/>
  <text class="mono rise a1" x="48" y="30" font-size="11" letter-spacing="2" fill="#888888">LANGUAGES</text>
  <text class="mono rise a1" x="196" y="30" font-size="14" fill="#444444">Ruby &#183; TypeScript &#183; JavaScript &#183; Go &#183; Python &#183; Java &#183; C++ &#183; SQL</text>
  <text class="mono rise a2" x="48" y="64" font-size="11" letter-spacing="2" fill="#888888">BACKEND</text>
  <text class="mono rise a2" x="196" y="64" font-size="14" fill="#444444">Ruby on Rails &#183; Puma &#183; Sidekiq &#183; HTTP/JSON APIs &#183; REST &#183; SOA</text>
  <text class="mono rise a3" x="48" y="98" font-size="11" letter-spacing="2" fill="#888888">FRONTEND</text>
  <text class="mono rise a3" x="196" y="98" font-size="14" fill="#444444">Vue.js &#183; Vite &#183; TypeScript &#183; componentization &#183; API consumption</text>
  <text class="mono rise a4" x="48" y="132" font-size="11" letter-spacing="2" fill="#888888">DATA</text>
  <text class="mono rise a4" x="196" y="132" font-size="14" fill="#444444">PostgreSQL &#183; PgBouncer &#183; JSONL &#183; filtering, pagination, data modeling</text>
  <text class="mono rise a5" x="48" y="166" font-size="11" letter-spacing="2" fill="#888888">INFRA</text>
  <text class="mono rise a5" x="196" y="166" font-size="14" fill="#444444">Docker &#183; Docker Compose &#183; Nginx &#183; Git &#183; GitHub &#183; per-environment deploys</text>
  <text class="mono rise a6" x="48" y="200" font-size="11" letter-spacing="2" fill="#888888">PRACTICES</text>
  <text class="mono rise a6" x="196" y="200" font-size="14" fill="#444444">OpenAPI 3.1 &#183; tests &#183; CORS &#183; API key &#183; structured logs &#183; health checks</text>
  <text class="mono rise a7" x="48" y="234" font-size="11" letter-spacing="2" fill="#888888">LOW LEVEL</text>
  <text class="mono rise a7" x="196" y="234" font-size="14" fill="#444444">Ghidra &#183; CMake &#183; PowerPC &#8594; x86-64 &#183; static recompilation</text>
</svg>
